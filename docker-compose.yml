services:
  db:
    image: postgres:16-alpine
    container_name: mov-financeira-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mov_financeira
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mov_financeira']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./api
    container_name: mov-financeira-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      LOG_LEVEL: info
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mov_financeira?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-nao-use-em-producao-1234567890}
      JWT_EXPIRES_IN: 1h
      SWAGGER_ENABLED: 'true'
      SEED_ON_START: 'true'
    ports:
      - '3001:3001'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:3001/health/ready'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  ui:
    build:
      context: ./ui
    container_name: mov-financeira-ui
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_URL: http://api:3001
    ports:
      - '3000:3000'
    restart: unless-stopped

volumes:
  pgdata:
